<!-- Google Analytics 4, property ChamorroGroup, stream "Chamorro Lab" (the same stream the Google Site used) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7PKMXGW6YT"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-7PKMXGW6YT');
document.addEventListener('DOMContentLoaded', function () {
  // the growth clip is a plain <video>, which enhanced measurement does not track
  document.querySelectorAll('video').forEach(function (v) {
    var sent = false;
    v.addEventListener('playing', function () { if (!sent) { sent = true; gtag('event', 'video_start', {video_title: v.getAttribute('aria-label') || 'video'}); } });
  });
  // the awards list on the People page
  document.querySelectorAll('details').forEach(function (d) {
    d.addEventListener('toggle', function () { if (d.open) gtag('event', 'details_open', {item: (d.querySelector('summary') || d).textContent.trim().slice(0, 60)}); });
  });
});
</script>
